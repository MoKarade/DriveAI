<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- CSP (durcissement) : scripts self + GIS ; réseau limité aux API Google utilisées.
         Les popups OAuth ne sont pas gouvernées par la CSP de l'ouvrant (flux GIS intact). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://tasks.googleapis.com https://accounts.google.com https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <!-- iOS ignore le manifeste pour l'icône d'accueil : il lui faut celle-ci, OPAQUE
         (Safari ne gère pas la transparence et la remplacerait par du noir). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DriveAI" />
    <meta name="theme-color" content="#0F1216" />
    <title>DriveAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
