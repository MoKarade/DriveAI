name: Auto-merge

# Quand la CI réussit sur une PR d'une branche claude/**, on la marque "ready" puis on la
# merge en squash. Déclenché via workflow_run : ce workflow est lu depuis la branche par
# défaut (main), il ne s'active donc qu'une fois présent sur main.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write # pour dispatcher le workflow Deploy après le merge

jobs:
  automerge:
    # ⚠️ SÉCURITÉ (revue de fond 2026-07-31) : le préfixe `claude/` est une CONVENTION, jamais une
    # preuve d'origine — pour une PR de fork, `head_branch` est choisi par l'auteur de la PR. Sur un
    # dépôt PUBLIC, sans le contrôle d'origine ci-dessous, n'importe qui pouvait ouvrir une PR depuis
    # un fork sur une branche `claude/x`, faire passer la CI (lecture seule, sans secret) et déclencher
    # merge + `deploy.yml` (clasp push dans le projet Apps Script de Marc, tous scopes). La condition
    # `head_repository.full_name == github.repository` REJETTE tout fork : seul le dépôt lui-même merge.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Trouver et merger la PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          number="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "Aucune PR ouverte pour $HEAD_BRANCH — rien à faire."
            exit 0
          fi
          echo "PR concernée : #$number"

          # ⚠️ SÉCURITÉ (revue Vague 1a) : le gate `if:` protège le DÉCLENCHEMENT du job, mais
          # `gh pr list --head` filtre par NOM de branche seulement — sur un dépôt public, une PR de
          # FORK portant la même branche `claude/x` pourrait être sélectionnée ici. On re-vérifie donc
          # sur la PR RÉSOLUE qu'elle n'est PAS cross-repo avant tout merge (défense en profondeur,
          # même esprit que le gate — la promesse « pas de code de fork déployé » codée de bout en bout).
          crossrepo="$(gh pr view "$number" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$crossrepo" != "false" ]; then
            echo "PR #$number vient d'un fork (isCrossRepository=$crossrepo) → auto-merge REFUSÉ."
            exit 0
          fi

          labels="$(gh pr view "$number" --repo "$REPO" --json labels --jq '.labels[].name')"
          if echo "$labels" | grep -qx 'do-not-merge'; then
            echo "Label 'do-not-merge' présent → auto-merge ignoré."
            exit 0
          fi

          # Sortir du mode draft si nécessaire (ignore l'erreur si déjà ready).
          gh pr ready "$number" --repo "$REPO" || true

          # Merge en squash + suppression de la branche.
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch

          # IMPORTANT : un merge fait par le bot (GITHUB_TOKEN) NE déclenche PAS les workflows
          # `on: push` (sécurité anti-récursion de GitHub Actions). On dispatche donc Deploy
          # explicitement pour que chaque merge déploie le moteur dans le projet Apps Script.
          #
          # RETRY (incident 2026-08-17, merge #278) : un 503 TRANSITOIRE de l'API GitHub sur le
          # dispatch était avalé par le `|| echo … ignoré` → moteur NON déployé, EN SILENCE, run
          # vert (le message parlait de « workflow absent ou secrets manquants », faux). Un
          # dispatch CRITIQUE se rejoue (backoff 2/4/8/16 s, la politique git-push du projet) et
          # un échec FINAL fait ÉCHOUER le run — un deploy perdu doit se VOIR, jamais s'ignorer.
          dispatcher() {
            local wf="$1"; local critique="$2"; local delai=2
            for essai in 1 2 3 4 5; do
              if gh workflow run "$wf" --repo "$REPO" --ref main; then
                echo "Dispatch de $wf : OK (essai $essai)."
                return 0
              fi
              echo "Dispatch de $wf raté (essai $essai/5) — nouvel essai dans ${delai}s."
              sleep "$delai"; delai=$((delai * 2))
            done
            if [ "$critique" = "critique" ]; then
              echo "::error::Dispatch de $wf IMPOSSIBLE après 5 essais — le moteur N'EST PAS déployé. Relancer deploy.yml à la main (Actions → Deploy → Run workflow)."
              return 1
            fi
            echo "::warning::Dispatch de $wf raté après 5 essais — ignoré (non critique)."
            return 0
          }
          dispatcher deploy.yml critique

          # Même raison : dispatcher le miroir Drive (ADR-0017) après chaque merge (non critique :
          # le miroir se rattrape au merge suivant, lui).
          dispatcher sync-drive.yml non-critique
