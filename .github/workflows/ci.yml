name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur la MÊME branche annule le run précédent : sans ça, un job figé continue de
# tourner (et de tenir un runner) pendant que le suivant démarre. `main` est exclu du groupe —
# on ne veut jamais annuler la validation d'un commit déjà mergé.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validation du scaffolding
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      # La convention de compte-rendu est une COPIE synchronisée de
      # claude-config/conventions/COMPTE-RENDU.md — un CLAUDE.md ne charge rien hors de son
      # arbre, donc le renvoi seul ne chargerait rien. Une copie sans contrôle redevient une
      # variante locale en silence : c'est le mode de panne que ce pas rend bruyant.
      # Pour la faire évoluer : modifier la SOURCE, propager, mettre à jour cette empreinte.
      - name: La convention de compte-rendu n'a pas dérivé
        run: echo "97e36acba8770c9614b6295773267b9690d07bc5bcd130b3bc0d03da996ab62b  docs/COMPTE-RENDU.md" | sha256sum -c -

      - name: JSON parseable
        run: |
          fail=0
          while IFS= read -r f; do
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "ok: $f"
            else
              echo "❌ JSON invalide: $f"; fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.json' -print)
          exit $fail

      - name: Workflows YAML valides
        run: |
          fail=0
          for f in .github/workflows/*.yml; do
            if python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" 2>/dev/null; then echo "ok: $f"; else echo "YAML invalide: $f"; fail=1; fi
          done
          exit $fail

      - name: Syntaxe des scripts shell
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then echo "ok: $f"; else echo "❌ Syntaxe: $f"; fail=1; fi
          done < <(find . -path ./.git -prune -o -name '*.sh' -print)
          exit $fail

      - name: Scan de secrets
        run: bash .github/scripts/secret-scan.sh .

      - name: Fichiers de référence présents
        run: bash .github/scripts/check-structure.sh .

      - name: Frontmatter des agents
        run: bash .github/scripts/check-agents.sh .

  test:
    name: Tests unitaires (logique pure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "Syntaxe des .gs (un .gs cassé fige le déploiement clasp)"
        # `node --check` ignore l'extension .gs → on copie en .js. Ne vérifie QUE la syntaxe
        # (pas les globals Google), ce qui suffit à attraper un déploiement cassé avant le merge.
        run: |
          tmp=$(mktemp -d); fail=0
          for f in src/*.gs; do cp "$f" "$tmp/$(basename "$f" .gs).js"; done
          for j in "$tmp"/*.js; do node --check "$j" || { echo "❌ Syntaxe: $(basename "$j" .js).gs"; fail=1; }; done
          exit $fail

      - name: Filet de tests du moteur (node --test, zéro dépendance)
        # Charge les .gs Apps Script dans un bac à sable Node (mocks Google) et vérifie la
        # logique de décision : routage, nommage, dates, garde zone protégée §1, prédicats
        # de collecte, invariant vie privée (ADR-0006/0007). Aucun `npm install` (0 dépendance).
        run: node --test test/*.test.js

  app:
    name: App web (garde-fous miroir + build)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances (npm ci, lockfile committé)
        working-directory: app
        # [CI-IGNORE-SCRIPTS] Un script d'installation de paquet s'exécute avec les droits du
        # runner, qui porte les secrets du workflow. MESURÉ sur ce dépôt avant d'être posé :
        # `npm ci --ignore-scripts` dans `app/`, puis tsc, vite build et 328 tests — tous verts.
        run: npm ci --ignore-scripts

      - name: "Tests vitest — dont le miroir des garde-fous §1/§2 (ADR-0008 : l'app mute Drive)"
        working-directory: app
        run: npm test

      - name: Typecheck + build (tsc --noEmit && vite build)
        working-directory: app
        # Un AVERTISSEMENT CSS d'esbuild n'échoue pas le build : une accolade en trop a passé la CI
        # au vert alors qu'elle faisait AVALER la règle suivante par le parseur (revue flotte
        # 2026-09-10). En prod le minifieur rattrapait l'erreur, mais pas en dev ni dans les captures
        # E2E — l'artefact que Marc regarde ne montrait donc pas ce que Vercel sert. On échoue dessus.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build-app.log
          if grep -q 'css-syntax-error' /tmp/build-app.log; then
            echo "::error::CSS invalide (css-syntax-error) — une règle est silencieusement avalée"
            exit 1
          fi

  screenshots:
    name: Captures d'écran UI (E2E mode mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dépendances (npm ci, lockfile committé)
        working-directory: app
        # [CI-IGNORE-SCRIPTS] Un script d'installation de paquet s'exécute avec les droits du
        # runner, qui porte les secrets du workflow. MESURÉ sur ce dépôt avant d'être posé :
        # `npm ci --ignore-scripts` dans `app/`, puis tsc, vite build et 328 tests — tous verts.
        run: npm ci --ignore-scripts

      # Étape la plus FRAGILE de la CI : elle tire des paquets apt et le binaire Chromium. Vécu
      # 2× le 19/08 — figée > 20 min sans rien produire, retenant le merge. Bornée pour qu'un
      # blocage devienne un ÉCHEC VISIBLE et rejouable, au lieu d'une attente muette.
      - name: Navigateur Playwright (Chromium seul)
        working-directory: app
        timeout-minutes: 6
        # [CI-NPX-NO-INSTALL] `--no-install` : sans lui, `npx` TÉLÉCHARGE le paquet depuis le
        # registre quand il ne le trouve pas localement, et exécute ses scripts de cycle de vie
        # — la surface que `--ignore-scripts` vient de fermer deux étapes plus haut, rouverte
        # ici, et sur une version NON figée en plus (le registre sert la dernière). Avec le
        # drapeau, npx n'utilise que le binaire de `app/node_modules/.bin`, donc la version que
        # le lockfile épingle, et échoue franchement s'il manque au lieu d'aller le chercher.
        # Mesuré le 18/09 : `npm ci --ignore-scripts` puis `npx --no-install playwright
        # --version` rend « Version 1.61.1 », le binaire local. `@playwright/test` est bien une
        # devDependency de `app/` (c'est ce qui rend le drapeau applicable ici).
        run: npx --no-install playwright install --with-deps chromium

      # VITE_E2E_MOCK=true est injectée par playwright.config.ts (webServer) : auth bouchonnée,
      # données locales (mockData.ts), AUCUN appel aux vraies API Google (api() lève en mock).
      # La variable n'existe nulle part ailleurs (ni Vercel, ni dev normal) — zéro fuite en prod.
      - name: Captures des 5 écrans × 2 tailles — pc et tel (Playwright, serveur de dev Vite mocké)
        working-directory: app
        run: npm run test:e2e

      - name: Publier les captures en artifact
        if: always() # même si le test échoue, les captures partielles aident au diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: app/e2e-screenshots/
          if-no-files-found: warn
          retention-days: 14
