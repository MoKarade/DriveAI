name: Deploy

# Déploie automatiquement le moteur (src/) dans le projet Apps Script de Marc à
# chaque arrivée sur `main` (donc après l'auto-merge d'une PR verte). Plus aucun
# `clasp push` manuel.
#
# Configuration UNIQUE côté Marc (3 min, une seule fois) — voir docs/DEPLOIEMENT.md :
#   Settings → Secrets and variables → Actions → New repository secret :
#     - CLASPRC_JSON         : le contenu de ~/.clasprc.json (généré par `clasp login`)
#     - SCRIPT_ID            : l'ID du projet Apps Script (depuis .clasp.json local)
#     - WEBAPP_DEPLOYMENT_ID : (OPTIONNEL) l'ID `AKfycb…` de l'URL /exec de la web app →
#         redéploie AUTOMATIQUEMENT la web app (Nouvelle version) à chaque merge touchant
#         WebApp.gs. Absent = redéploiement manuel requis (repli, aucun échec rouge).
# Tant que CLASPRC_JSON/SCRIPT_ID sont absents, le job se contente d'un message et réussit.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-appsscript
  cancel-in-progress: false # ne jamais interrompre un clasp push en cours (état partiel)

jobs:
  deploy:
    # Plafond : sans lui, un job fige tourne SIX HEURES avant d'echouer (vecu sur
    # DriveAI le 19/08/2026). Calibre sur la duree reelle — non observe - pousse vers Apps Script.
    timeout-minutes: 20
    name: clasp push (Apps Script)
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration de déploiement
        id: guard
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::notice::Déploiement auto non configuré (secrets CLASPRC_JSON / SCRIPT_ID absents). Voir docs/DEPLOIEMENT.md. On saute."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          # [CI-PERSIST-CREDS] `actions/checkout` v2+ écrit le GITHUB_TOKEN dans la config git du
          # runner POUR TOUT LE RESTE DU RUN : n'importe quelle étape suivante, y compris une
          # action tierce, peut le lire. Vérifié un par un : aucun workflow de ce dépôt ne fait
          # de `git push` ni d'appel `gh`, donc aucun n'a besoin du jeton persisté.
          persist-credentials: false

      - name: Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20' # clasp v3 échoue « Premature close » en Node 22 ; 20 fonctionne

      - name: Installer clasp
        if: steps.guard.outputs.ready == 'true'
        # [CI-VERSION-FIGEE] Version EXACTE, et non `@latest` implicite : sans elle, une
        # publication majeure de clasp change le comportement du déploiement sans qu'une
        # ligne du dépôt n'ait bougé. 3.4.1 relevée sur le registre le 18/09 (`npm view`),
        # jamais devinée. À monter volontairement, en lisant le changelog.
        #
        # [CI-IGNORE-SCRIPTS] Et `--ignore-scripts`, qui manquait : une installation GLOBALE
        # exécute les scripts du paquet avec les droits du runner, celui-là même qui porte
        # `CLASPRC_JSON` et `SCRIPT_ID` deux étapes plus bas. Mesuré avant d'être posé (18/09) :
        # clasp 3.4.1 ne déclare qu'un `prepare` (jamais exécuté à l'installation d'un paquet
        # publié — il tourne à l'empaquetage), aucun `install` ni `postinstall` ; installé avec
        # le drapeau, `clasp --version` rend bien « 3.4.1 ».
        run: npm install -g @google/clasp@3.4.1 --ignore-scripts

      - name: Authentifier clasp + cibler le projet
        if: steps.guard.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{ "scriptId": "%s", "rootDir": "src" }\n' "$SCRIPT_ID" > .clasp.json

      - name: Pousser le code
        id: push
        if: steps.guard.outputs.ready == 'true'
        run: clasp push --force || (sleep 5 && clasp push --force) # retry léger (erreurs réseau transitoires)

      # Redéploie la WEB APP `/exec` en NOUVELLE VERSION (décision Marc 2026-07-24 « fais le », après
      # 2 redéploiements manuels vécus). Sans ça, `clasp push` met à jour le HEAD mais `/exec` sert
      # l'ANCIENNE version → toute nouvelle action `doPost` (ex. `chat-assistant`) tombe en silence
      # (leçon 2026-07-24). `clasp deploy` = alias de `create-deployment` (clasp v3) ; `-i` redéploie
      # le MÊME deploymentId → l'URL /exec NE CHANGE PAS (rien à retoucher dans l'app/Vercel).
      # Secret OPTIONNEL : tant que WEBAPP_DEPLOYMENT_ID est absent, on saute (le redéploiement manuel
      # reste le repli — aucun échec rouge). L'ID = la partie `AKfycb…` de l'URL /exec (voir DEPLOIEMENT.md).
      - name: Redéployer la web app (/exec inchangé)
        if: steps.guard.outputs.ready == 'true'
        env:
          WEBAPP_DEPLOYMENT_ID: ${{ secrets.WEBAPP_DEPLOYMENT_ID }}
        run: |
          if [ -z "$WEBAPP_DEPLOYMENT_ID" ]; then
            echo "::notice::WEBAPP_DEPLOYMENT_ID absent — web app /exec NON redéployée auto (redéploiement manuel requis après un changement de WebApp.gs). Voir docs/DEPLOIEMENT.md."
            exit 0
          fi
          clasp deploy -i "$WEBAPP_DEPLOYMENT_ID" -d "auto ${GITHUB_SHA}" \
            || (sleep 5 && clasp deploy -i "$WEBAPP_DEPLOYMENT_ID" -d "auto ${GITHUB_SHA}")

      # Ré-installe le DÉCLENCHEUR (ADR-0032) — c'était le DERNIER geste manuel de Marc : ouvrir
      # l'éditeur → `Main.gs` → `installerTrigger`. Sans lui, `clasp push` peut être vert pendant que
      # le déclencheur continue d'exécuter la version PRÉCÉDEMMENT chargée (piège de déploiement (3) :
      # ~4 jours de prod figée vécus, CI verte, zéro erreur). Supprimer/recréer le déclencheur force
      # le rechargement. Placé APRÈS le redéploiement de la web app : c'est la NOUVELLE version qui
      # doit servir l'action. Jamais bloquant (le code est poussé de toute façon).
      #
      # ⚠️ [CI-TRIGGER-APRES-PUSH] La condition suit le PUSH, jamais le DEPLOY — et c'est `always()`
      # qui le permet. Sans lui, GitHub Actions SAUTE cette étape dès qu'une étape amont échoue :
      # le 21/09/2026, `clasp deploy` a buté sur les 200 versions d'Apps Script, le déclencheur n'a
      # donc pas été réinstallé, et le tick a continué d'exécuter l'ANCIEN code — mesuré sur les
      # ticks de 20:38 et 20:44 UTC, postérieurs au push de 20:39:36 : la ligne de Santé attendue
      # était absente. Autrement dit, N'IMPORTE QUEL échec du redéploiement de la web app (quota,
      # réseau, secret) figeait le moteur en silence. `steps.push.outcome == 'success'` est la
      # bonne condition : ce qui décide du code exécuté par le TICK, c'est le push.
      - name: Assurer le déclencheur (fin du geste manuel)
        if: always() && steps.push.outcome == 'success'
        continue-on-error: true
        env:
          URL: ${{ secrets.DRIVEAI_WEBAPP_URL }}
          SECRET: ${{ secrets.DRIVEAI_SYNC_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ] || [ -z "${SECRET:-}" ]; then
            echo "::notice::DRIVEAI_WEBAPP_URL / DRIVEAI_SYNC_SECRET absents — déclencheur non réinstallé automatiquement."
            exit 0
          fi
          SECRET_ENC="$(jq -rn --arg s "$SECRET" '$s|@uri')"
          # PAS de `-X POST` avec `-L` (405 sur la redirection /macros/echo — leçon vécue).
          CODE="$(curl -sS -L --max-time 120 -o /tmp/trigger.json -w '%{http_code}' \
            "${URL}?action=assurer-trigger&secret=${SECRET_ENC}" \
            -H 'Content-Type: text/plain;charset=utf-8' --data-binary '{}' || echo "000")"
          # SIGNAL INDÉPENDANT (leçon « un déploiement vert ne prouve rien ») : le champ `version`
          # n'existe que dans la version qui connaît l'action. Absent ⇒ /exec sert encore l'ancienne
          # (piège (4) : l'appel tombe dans le `else` du doPost et « réussit » en silence).
          if [ "$CODE" = "200" ] && jq -e '.ok == true and (.version | type == "string")' /tmp/trigger.json >/dev/null 2>&1; then
            echo "Déclencheur réinstallé — version servie : $(jq -r '.version' /tmp/trigger.json)"
          else
            echo "::warning::Déclencheur NON confirmé (HTTP $CODE). Si ça persiste, la web app /exec n'est pas redéployée. Extrait : $(head -c 200 /tmp/trigger.json)"
          fi
