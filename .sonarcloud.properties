# Configuration de l'analyse AUTOMATIQUE de SonarCloud (aucun workflow Sonar dans .github/ :
# c'est ce fichier, à la racine, que l'analyse automatique lit — un sonar-project.properties
# serait ignoré).
#
# app/src/i18n.ts sort UNIQUEMENT de la détection de copier-coller (arbitrage de Marc,
# 23/09/2026). Un fichier de traductions répète chaque clé en français puis en anglais par
# construction : chaque PR qui ajoute du texte faisait échouer le Quality Gate (5,3 % sur #397,
# 7,5 % sur #402) sans qu'aucun code ne soit dupliqué, et un rouge permanent finit par ne plus
# être lu. Bugs, vulnérabilités et code smells y restent analysés. Ne pas élargir cette liste
# à du code : une duplication réelle se factorise, elle ne s'exclut pas.
sonar.cpd.exclusions=app/src/i18n.ts
